services:
  observatory:
    build:
      context: ../..
      dockerfile: packaging/observatory/Dockerfile
    restart: unless-stopped
    environment:
      FIBERPULSE_OBSERVATORY_ADDRESS: 0.0.0.0:8090
      FIBERPULSE_OBSERVATORY_DATA_DIR: /data
      FIBERPULSE_OBSERVATORY_LOCATION_MODE: cloudflare
    volumes:
      - ./data:/data
    ports:
      - 127.0.0.1:8090:8090
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
