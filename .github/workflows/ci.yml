name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.7
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Verify embedded dashboard is current
        run: diff -r dashboard/dist internal/localapi/web
      - name: Test Go core
        run: go test -race ./... && go vet ./...
      - name: Static and vulnerability checks
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cross-build native Windows artifacts
        run: docker build -f packaging/windows/Dockerfile.build -t fiberpulse-agent-build .
      - name: Extract artifacts
        run: mkdir -p dist && docker run --rm -v "$PWD/dist:/artifacts" fiberpulse-agent-build
      - name: Record checksums
        run: sha256sum dist/*.exe > dist/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fiberpulse-windows-x64-development
          path: dist/

  macos:
    strategy:
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.7
          cache: true
      - name: Test macOS build
        run: go test ./... && sh packaging/macos/build-app.sh
      - name: Verify universal macOS binaries
        run: |
          lipo dist/macos/FiberPulse.app/Contents/MacOS/fiberpulse -verify_arch arm64 x86_64
          lipo dist/macos/FiberPulse.app/Contents/MacOS/fiberpulse-updater -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/macos/FiberPulse.app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fiberpulse-${{ matrix.runner }}-development
          path: dist/macos/*.zip
