name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.x
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm audit --audit-level=high && npm run build
      - name: Verify embedded dashboard is current
        run: diff -r dashboard/dist internal/localapi/web
      - name: Test Go core
        run: go test -race ./... && go vet ./...

  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cross-build native Windows artifacts
        run: docker build -f packaging/windows/Dockerfile.build -t fiberpulse-agent-build .
      - name: Extract artifacts
        run: mkdir -p dist && docker run --rm -v "$PWD/dist:/artifacts" fiberpulse-agent-build
      - name: Record checksums
        run: sha256sum dist/*.exe > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiberpulse-windows-x64-development
          path: dist/

  macos:
    strategy:
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.x
          cache: true
      - name: Test macOS build
        run: go test ./... && sh packaging/macos/build-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiberpulse-${{ matrix.runner }}-development
          path: dist/macos/*.zip
